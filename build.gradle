plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.thc'
version = '0.0.1-SNAPSHOT'
description = 'goOrNotDev'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.1.0'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:4.1.0'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    // jjwt 는 Jackson 2 를 쓰므로 jackson-databind 가 여기로 함께 딸려온다.
    // 애플리케이션 코드는 Spring Boot 4 의 Jackson 3(tools.jackson) 만 사용한다
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    runtimeOnly 'com.mysql:mysql-connector-j'
    testRuntimeOnly 'com.h2database:h2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()

    // 외부 API 를 실제로 호출하는 테스트는 전부 기본적으로 꺼둔다.
    // 쿼터(TourAPI 1,000건/일, 카카오맵 무료 쿼터)를 매 빌드마다 소모하지 않기 위함이다.
    //   ./gradlew test -Dtourapi.live=true                        TourApiClientLiveTest
    //   ./gradlew test -Dkakao.live=true                          KakaoLocalClientLiveTest
    //   ./gradlew test --tests '*RegionSeedRunner' -Dregion.seed=true   regions.json 시딩(1회성)
    systemProperty 'tourapi.live', System.getProperty('tourapi.live', 'false')
    systemProperty 'kakao.live', System.getProperty('kakao.live', 'false')
    systemProperty 'region.seed', System.getProperty('region.seed', 'false')
    // 기존 regions.json 을 무시하고 처음부터 다시 수집 (큐레이션 기준을 바꿨을 때만)
    systemProperty 'region.seed.reset', System.getProperty('region.seed.reset', 'false')

    // 시딩 진행 상황을 콘솔에서 봐야 해서 표준 출력을 흘려보낸다
    testLogging {
        showStandardStreams = true
        events 'failed'
    }
}
