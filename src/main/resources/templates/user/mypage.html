<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('마이페이지', 'mypage')}"></head>

<body data-auth="pending">

<div class="app">
    <header th:replace="~{layout/base :: header}"></header>

    <main class="app__main">
        <div class="page-head">
            <h1 class="page-head__title">마이페이지</h1>
            <p class="page-head__desc">계정 정보를 확인하고 수정할 수 있어요</p>
        </div>

        <!--/* 불러오기 전 표시 */-->
        <p class="state" id="loading">불러오는 중…</p>

        <div id="content" hidden>

            <!--/* 내 정보 — 조회/수정 모드를 data-mode 로 전환 */-->
            <section class="card" id="profile-card" data-mode="view">
                <div class="profile">
                    <span class="profile__avatar" data-field="initial">·</span>
                    <div>
                        <p class="profile__name" data-field="displayName">—</p>
                        <p class="profile__meta" data-field="email">—</p>
                    </div>
                </div>

                <div class="card__head">
                    <h2 class="card__title">내 정보</h2>
                    <button class="btn btn--text" type="button" data-mode-view data-action="edit">수정</button>
                </div>

                <!--/* 조회 모드 */-->
                <div data-mode-view>
                    <ul class="info-list">
                        <li class="info-list__row">
                            <span class="info-list__label">아이디</span>
                            <span class="info-list__value" data-field="username"></span>
                        </li>
                        <li class="info-list__row">
                            <span class="info-list__label">이름</span>
                            <span class="info-list__value" data-field="name"></span>
                        </li>
                        <li class="info-list__row">
                            <span class="info-list__label">이메일</span>
                            <span class="info-list__value" data-field="email"></span>
                        </li>
                        <li class="info-list__row">
                            <span class="info-list__label">휴대폰</span>
                            <span class="info-list__value" data-field="phone"></span>
                        </li>
                        <li class="info-list__row">
                            <span class="info-list__label">생년월일</span>
                            <span class="info-list__value" data-field="birth"></span>
                        </li>
                        <li class="info-list__row">
                            <span class="info-list__label">가입일</span>
                            <span class="info-list__value" data-field="createdAt"></span>
                        </li>
                    </ul>
                </div>

                <!--/* 수정 모드 — 빈 칸은 전송하지 않아 기존 값이 유지된다 */-->
                <form class="form" id="profile-form" data-mode-edit novalidate>
                    <div class="field">
                        <label class="field__label" for="username-readonly">아이디</label>
                        <input class="field__input" type="text" id="username-readonly" disabled>
                        <p class="field__hint">아이디는 변경할 수 없습니다.</p>
                    </div>

                    <div class="field">
                        <label class="field__label" for="name">이름</label>
                        <input class="field__input" type="text" id="name" name="name" autocomplete="name">
                        <p class="field__error"></p>
                    </div>

                    <div class="field">
                        <label class="field__label" for="email">이메일</label>
                        <input class="field__input" type="email" id="email" name="email" autocomplete="email">
                        <p class="field__error"></p>
                    </div>

                    <div class="field">
                        <label class="field__label" for="phone">휴대폰</label>
                        <input class="field__input" type="tel" id="phone" name="phone" autocomplete="tel">
                        <p class="field__error"></p>
                    </div>

                    <div class="field">
                        <label class="field__label" for="birth">생년월일</label>
                        <input class="field__input" type="date" id="birth" name="birth">
                        <p class="field__error"></p>
                    </div>

                    <div class="field">
                        <label class="field__label" for="password">새 비밀번호</label>
                        <input class="field__input" type="password" id="password" name="password"
                               autocomplete="new-password" placeholder="변경할 때만 입력하세요" minlength="8">
                        <p class="field__error"></p>
                    </div>

                    <div class="btn-row">
                        <button class="btn btn--ghost" type="button" data-action="cancel">취소</button>
                        <button class="btn btn--primary" type="submit">저장</button>
                    </div>
                </form>
            </section>

            <!--/* 위험 구역 */-->
            <section class="card danger-zone">
                <h2 class="card__title">회원 탈퇴</h2>
                <p class="danger-zone__desc">
                    탈퇴하면 저장한 여행 기록을 더 이상 볼 수 없습니다.<br>
                    회원 정보는 즉시 삭제되며 되돌릴 수 없습니다.
                </p>
                <button class="btn btn--danger btn--block" type="button" data-action="withdraw">탈퇴하기</button>
            </section>

        </div>
    </main>

    <footer th:replace="~{layout/base :: footer}"></footer>
</div>

<script type="module" th:src="@{/js/page/mypage.js}"></script>

</body>
</html>
