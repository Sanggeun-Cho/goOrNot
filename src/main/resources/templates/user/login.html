<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('로그인', 'auth')}"></head>

<body data-auth="pending">

<div class="app">
    <header th:replace="~{layout/base :: header}"></header>

    <main class="app__main">
        <section class="auth">
            <div class="auth__head">
                <h1 class="auth__title">다시 오셨네요</h1>
                <p class="auth__desc">여정을 이어가려면 로그인이 필요해요</p>
            </div>

            <div class="auth__card">
                <form class="form" id="login-form" novalidate>
                    <div class="field">
                        <label class="field__label" for="username">아이디</label>
                        <input class="field__input" type="text" id="username" name="username"
                               autocomplete="username" placeholder="아이디를 입력하세요" required>
                        <p class="field__error"></p>
                    </div>

                    <div class="field">
                        <label class="field__label" for="password">비밀번호</label>
                        <input class="field__input" type="password" id="password" name="password"
                               autocomplete="current-password" placeholder="비밀번호를 입력하세요" required>
                        <p class="field__error"></p>
                    </div>

                    <button class="btn btn--primary btn--block auth__submit" type="submit">로그인</button>
                </form>
            </div>

            <p class="link-row">
                아직 계정이 없으신가요?
                <a th:href="@{/user/signup}">회원가입</a>
            </p>
        </section>
    </main>

    <footer th:replace="~{layout/base :: footer}"></footer>
</div>

<script type="module" th:src="@{/js/page/login.js}"></script>

</body>
</html>
