<!DOCTYPE html>
<!--/*
  base.html
  각 화면이 가져다 쓰는 공통 조각 모음. 이 파일 자체는 렌더링되지 않는다.

  사용 예)
    <head th:replace="~{layout/base :: head('로그인', 'auth')}"></head>
    <header th:replace="~{layout/base :: header}"></header>
    <footer th:replace="~{layout/base :: footer}"></footer>
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<!--/* 공통 head — title 과 화면 전용 css 파일명을 인자로 받는다 */-->
<head th:fragment="head(title, pageCss)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#185FA5">
    <title th:text="|${title} · 갈래말래|">갈래말래</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:if="${pageCss != null}" th:href="@{'/css/' + ${pageCss} + '.css'}">
</head>

<body>

<!--/* 공통 헤더 — 로그인 여부에 따른 메뉴 노출은 CSS(body[data-auth]) 가 처리한다 */-->
<header th:fragment="header" class="app-header">
    <a class="app-header__brand" th:href="@{/}">갈래<span>말래</span></a>

    <nav class="app-header__nav">
        <a data-nav-guest th:href="@{/user/login}">로그인</a>
        <a data-nav-auth th:href="@{/user/mypage}">마이페이지</a>
        <button data-nav-auth type="button" data-action="logout">로그아웃</button>
    </nav>
</header>

<!--/* 공통 푸터 — 데이터 출처 표기는 공모전 필수 요건이라 모든 화면에 노출한다 */-->
<footer th:fragment="footer" class="app-footer">
    <p>출처: ⓒ한국관광공사</p>
    <p>2026 관광데이터 활용 공모전 출품작 · 개발 중</p>
</footer>

</body>
</html>
